set -g mouse on
setw -g mode-keys vi
unbind C-b
set -g prefix C-h
bind C-h send-prefix

# How long the `gcloud auth login` session has left, in front of the tmux
# default status-right. Plain while healthy, orange under 2h, red under 30m.
set -g status-right "#(~/git/vimrc/bin/gcloud-session-ttl)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -g status-right-length 70
